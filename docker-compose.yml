services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: house_rent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/house_rent
      NODE_ENV: production
      # Mount the rest of your secrets via a .env file or Docker secrets:
      # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ...
      # CLERK_SECRET_KEY: ...
      # CALCOM_TOKEN_ENCRYPTION_KEY: ...
      # SENTRY_DSN: ...
      # LOG_LEVEL: info
    env_file:
      - .env
    command: >
      sh -c "npx prisma migrate deploy && node server.js"

volumes:
  postgres_data:
