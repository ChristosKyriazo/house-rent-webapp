name: E2E

# Playwright against a real deployed environment — never localhost.
#
# ⚠️ This workflow needs a deployed staging environment. While staging is unprovisioned
# (repo variable DEPLOY_STAGING_ENABLED is not "true") there is nothing to test
# against, so the run becomes a visible no-op: it annotates a warning and says
# so in the job summary rather than failing the release PR, and rather than
# quietly pointing a data-writing suite at production.
#
# Two rungs of the ladder:
#   • smoke ("public" project, no credentials) runs after every staging deploy
#   • full  (all 6 projects) runs on a PR from staging → main, i.e. the release gate
#
# Authenticated projects need the TEST_* Clerk credentials. When those secrets
# are absent the run degrades to smoke-only rather than failing — a missing
# secret should not look like a broken app.
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      base_url:
        description: Environment to test against
        type: string
        default: https://staging.kaparro.com
      suite:
        description: '"smoke" (public only) or "full" (all projects)'
        type: string
        default: smoke
  workflow_dispatch:
    inputs:
      base_url:
        description: Environment to test against
        type: string
        default: https://staging.kaparro.com
      suite:
        description: '"smoke" or "full"'
        type: choice
        options: [smoke, full]
        default: smoke

jobs:
  e2e:
    # A PR into main is the release gate and always runs the full suite.
    name: ${{ (github.event_name == 'pull_request' && 'full') || inputs.suite }} → ${{ (github.event_name == 'pull_request' && 'https://staging.kaparro.com') || inputs.base_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # E2E only ever targets staging, so it reads staging's CLERK_SECRET_KEY and TEST_*
    # accounts. Without this the job sees repository secrets only, and the
    # authenticated projects would silently degrade to smoke.
    environment: staging

    env:
      E2E_BASE_URL: ${{ (github.event_name == 'pull_request' && 'https://staging.kaparro.com') || inputs.base_url }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
      TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
      TEST_RENTER_EMAIL: ${{ secrets.TEST_RENTER_EMAIL }}
      TEST_RENTER_PASSWORD: ${{ secrets.TEST_RENTER_PASSWORD }}
      TEST_BROKER_EMAIL: ${{ secrets.TEST_BROKER_EMAIL }}
      TEST_BROKER_PASSWORD: ${{ secrets.TEST_BROKER_PASSWORD }}
      TEST_BOTH_EMAIL: ${{ secrets.TEST_BOTH_EMAIL }}
      TEST_BOTH_PASSWORD: ${{ secrets.TEST_BOTH_PASSWORD }}

    steps:
      - name: Is there a staging environment to test against?
        id: gate
        run: |
          if [ "${{ vars.DEPLOY_STAGING_ENABLED }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Staging is not provisioned (DEPLOY_STAGING_ENABLED is not 'true') — no E2E ran. This release gate is currently inert."
            {
              echo "### E2E skipped — no staging environment"
              echo ""
              echo "\`DEPLOY_STAGING_ENABLED\` is not \`true\`, so there is no deployed"
              echo "staging environment to test against."
              echo ""
              echo "**This means the \`dev\` → \`main\` release gate is not testing anything.**"
              echo "Browser-level regressions will reach production unnoticed until staging exists."
              echo ""
              echo "Running the suite against production is not an option: the specs write data."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Decide which projects to run
        if: steps.gate.outputs.run == 'true'
        id: scope
        run: |
          suite="${{ (github.event_name == 'pull_request' && 'full') || inputs.suite }}"
          if [ "$suite" = "full" ] && [ -n "$TEST_OWNER_EMAIL" ] && [ -n "$CLERK_SECRET_KEY" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Running the full suite (all projects)."
          else
            if [ "$suite" = "full" ]; then
              echo "::warning::TEST_* / CLERK_SECRET_KEY secrets are not set — falling back to smoke-only. Authenticated journeys are NOT covered by this run."
            fi
            echo "args=--project=public" >> "$GITHUB_OUTPUT"
            echo "Running smoke only (public project)."
          fi

      - name: Run Playwright
        if: steps.gate.outputs.run == 'true'
        run: npx playwright test ${{ steps.scope.outputs.args }}

      - name: Upload report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
