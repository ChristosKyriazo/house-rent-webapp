name: Deploy

on:
  push:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      full_image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ github.ref_name }}-latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NOTE: DATABASE_URL and CLERK_SECRET_KEY are deliberately NOT build args.
          # The Dockerfile provides safe build-time placeholders; real values are
          # written to the server's .env by the deploy job below and never baked
          # into any image layer.

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-push
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Sync Caddyfile to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ github.ref_name == 'main' && secrets.SERVER_HOST_PROD || secrets.SERVER_HOST_STAGING }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: Caddyfile
          target: /opt/house-rent/

      - name: Write .env and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref_name == 'main' && secrets.SERVER_HOST_PROD || secrets.SERVER_HOST_STAGING }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/house-rent

            # ── Write .env atomically from CI/CD secrets ──────────────────────
            # Write to a temp file first; chmod before any data lands in it;
            # then rename atomically so the running container never sees a partial file.
            tmp=$(mktemp .env.XXXXXX)
            chmod 600 "$tmp"

            # The GITHUB_ACTIONS_ENV_EOF delimiter is single-quoted so the server
            # shell performs zero expansion — GitHub Actions has already substituted
            # all ${{ secrets.* }} expressions before this script is sent over SSH.
            cat > "$tmp" << 'GITHUB_ACTIONS_ENV_EOF'
            # Auto-generated by GitHub Actions — do not edit manually.
            # Rotate a secret by updating it in GitHub → Settings → Environments
            # and pushing any commit to redeploy.

            APP_IMAGE=${{ needs.build-push.outputs.full_image }}

            # ── Database ──────────────────────────────────────────────────────
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}

            # ── Clerk auth ────────────────────────────────────────────────────
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

            # ── Observability (optional — leave blank if no Sentry account) ───
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN }}

            # ── Third-party APIs ──────────────────────────────────────────────
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
            CALCOM_TOKEN_ENCRYPTION_KEY=${{ secrets.CALCOM_TOKEN_ENCRYPTION_KEY }}

            # ── App config ────────────────────────────────────────────────────
            ADMIN_SECRET=${{ secrets.ADMIN_SECRET }}
            LOG_LEVEL=info
            GITHUB_ACTIONS_ENV_EOF

            mv "$tmp" .env

            # ── Pull new image ────────────────────────────────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull app

            # ── Rolling restart (app only — DB and Caddy keep running) ────────
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans app

            # ── Reload Caddy if Caddyfile changed ─────────────────────────────
            # caddy reload validates the new config first — a bad Caddyfile will NOT
            # take down the running server; it will keep serving the old config.
            docker compose -f docker-compose.prod.yml exec -T caddy caddy reload \
              --config /etc/caddy/Caddyfile --adapter caddyfile || true

            # ── Health check ──────────────────────────────────────────────────
            for i in $(seq 1 30); do
              if curl -sf http://localhost/api/healthz > /dev/null 2>&1; then
                echo "App is healthy"
                exit 0
              fi
              echo "Waiting for app... ($i/30)"
              sleep 3
            done
            echo "App failed to become healthy"
            exit 1
