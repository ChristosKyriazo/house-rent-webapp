name: CI

# The fast gate. Runs on every feature-branch push (so you get a red X within
# ~3 minutes of pushing), on PRs into dev/main, and — via workflow_call — as the
# blocking first job of deploy.yml so a broken commit never reaches a server.
on:
  push:
    branches-ignore: [main, dev] # pushes to main/dev come in through deploy.yml
  pull_request:
    branches: [main, dev]
  workflow_call:

# A newer push to the same branch cancels the older run. Never applied to
# deploy-triggered runs, which must always complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Must match .nvmrc, package.json engines, and the Dockerfile.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test
        env:
          DATABASE_URL: file:./test.db

      - name: Build
        run: npm run build
        env:
          # Provide placeholder values so Next.js can resolve env vars at build time
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_placeholder' }}
          DATABASE_URL: file:./test.db
